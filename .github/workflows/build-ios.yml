# Lila Home — iOS 未签名包构建
#
# 产物：未签名 IPA（LilaHome-unsigned.ipa），供用户在 Windows 上用个人
# Apple 证书自签后装到自己已登记 UDID 的设备上。本仓库不存任何证书、
# 描述文件或签名密钥，CI 全程无签名（CODE_SIGNING_ALLOWED=NO）。
#
# 注意：本文件不能经 GitHub API 推送（GitHub App 无 workflows 写权限），
# 须由人工在 GitHub 网页编辑器里建在 main 分支（见 docs/STAGE1_LOG.md）。
name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web (native mode, absolute API URL)
        working-directory: apps/web
        run: VITE_API_URL=http://3.12.156.80/api npm run build

      - name: Sync Capacitor iOS
        working-directory: apps/web
        run: npx cap sync ios

      - name: Build unsigned .app (no code signing)
        # 注意：生成工程里没有共享 scheme 文件（scheme 是 Xcode 首次打开时
        # 自动生成的，不进仓库），故用 -target App 而不用 -scheme App。
        # 此 Xcode 版本下 -archivePath 与 -derivedDataPath 都强制要求
        # -scheme（两次 CI 均因此报 exit 64），所以两个标志都不用：
        # 改用 CONFIGURATION_BUILD_DIR 把产物直接输出到固定目录。
        working-directory: apps/web
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            build CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/build/App.app"
          test -d "$APP_PATH" || { echo "App.app not found at $APP_PATH"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r LilaHome-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LilaHome-unsigned-ipa
          path: ${{ runner.temp }}/LilaHome-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
